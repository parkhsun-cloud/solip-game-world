<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐔 닭들의 복싱 챔피언십</title><style>
*{box-sizing:border-box;touch-action:manipulation}body{font-family:'Segoe UI',sans-serif;background:#121218;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:10px;user-select:none}.container{width:100%;max-width:1040px;background:#1e1e2e;border:3px solid #d32f2f;border-radius:16px;padding:15px;box-shadow:0 0 30px #d32f2f66;display:flex;flex-direction:column;align-items:center}h1{text-align:center;color:#ffca28;margin:0 0 10px;font-size:22px;border-bottom:2px solid #d32f2f;padding-bottom:8px;width:100%;text-shadow:2px 2px 4px black}.canvas-container{width:100%;margin-bottom:10px;display:flex;justify-content:center}canvas{background:#262636;border:3px solid #455a64;border-radius:12px;box-shadow:inset 0 0 15px #000c;max-width:100%;height:auto;display:block}.touch-controls{display:flex;justify-content:space-between;width:100%;max-width:1000px;margin-top:10px;gap:15px}.touch-group{display:flex;gap:10px}.touch-btn{background:linear-gradient(145deg,#2a2a3c,#1a1a28);border:2px solid #555;color:white;border-radius:12px;padding:15px 22px;font-size:16px;font-weight:bold;box-shadow:0 4px 8px #0006;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:70px;min-height:60px}.touch-btn:active,.touch-btn.active{background:#d32f2f;border-color:#ffca28;transform:scale(.95)}.touch-btn.guard-btn:active,.touch-btn.guard-btn.active{background:#0288d1}.controls-guide{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;background:#2a2a3c;padding:10px;border-radius:8px;font-size:12px;text-align:center;border:1px solid #455a64;margin:10px 0}.key-badge{background:#37474f;border:1px solid #78909c;padding:2px 6px;border-radius:4px;font-weight:bold;color:#ffca28}.btn-reset{width:100%;padding:12px;background:linear-gradient(135deg,#d32f2f,#b71c1c);color:white;font-size:16px;font-weight:bold;border:0;border-radius:8px;cursor:pointer;box-shadow:0 4px 6px #0005}.btn-reset:hover{background:linear-gradient(135deg,#f44336,#d32f2f)}@media(max-width:650px){.touch-btn{padding:10px 7px;min-width:0;font-size:12px;min-height:52px}.touch-group{gap:4px}.touch-controls{gap:5px}.controls-guide{font-size:10px}}
</style></head><body><div class="container"><h1>🥊 닭들의 복싱 챔피언십 🐔</h1><div class="canvas-container"><canvas id="gameCanvas" width="1000" height="420"></canvas></div><div class="touch-controls"><div class="touch-group"><button class="touch-btn" id="btnLeft">⬅️ 뒤로</button><button class="touch-btn" id="btnRight">➡️ 앞으로</button></div><div class="touch-group"><button class="touch-btn guard-btn" id="btnGuard">🛡️ 위빙</button><button class="touch-btn" id="btnJab">🥊 잽</button><button class="touch-btn" id="btnHook" style="color:#ffca28">💥 훅</button></div></div><div class="controls-guide"><div><span class="key-badge">A / D</span> : 스텝</div><div><span class="key-badge">J</span> : 잽</div><div><span class="key-badge">K</span> : 강한 훅 (MP소모)</div><div><span class="key-badge">Space</span> : 위빙(가드)</div></div><button class="btn-reset" onclick="resetGame()">🔄 경기 재시작</button></div><script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),RING_LEFT=80,RING_RIGHT=920,RING_Y=340;let keys={},touchState={left:false,right:false},isGameOver=false,gameMessage='',particles=[];
const player={x:220,y:RING_Y-70,width:50,height:70,vx:0,speed:5,hp:100,maxHp:100,stamina:100,maxStamina:100,facing:'right',isPunching:false,punchType:'jab',punchTimer:0,isGuarding:false,color:'#fff',gloveColor:'#d32f2f'};
const enemy={x:720,y:RING_Y-75,width:55,height:75,vx:0,speed:3.2,hp:100,maxHp:100,stamina:100,maxStamina:100,facing:'left',isPunching:false,punchType:'jab',punchTimer:0,punchCooldown:0,isGuarding:false,aiState:'IDLE',stateTimer:0,color:'#37474f',gloveColor:'#1976d2'};
window.addEventListener('keydown',e=>{if(['KeyA','KeyD','KeyJ','KeyK','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(!isGameOver){if(e.code==='KeyJ'&&!e.repeat)triggerPlayerJab();if(e.code==='KeyK'&&!e.repeat)triggerPlayerHook();if(e.code==='Space')player.isGuarding=true}});window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')player.isGuarding=false});window.addEventListener('blur',()=>{keys={};touchState.left=touchState.right=false;player.isGuarding=false});
function bindTouchButton(id,start,end){let btn=document.getElementById(id);const down=e=>{e.preventDefault();btn.classList.add('active');start()},up=e=>{e.preventDefault();btn.classList.remove('active');if(end)end()};btn.addEventListener('pointerdown',e=>{btn.setPointerCapture(e.pointerId);down(e)});btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',()=>{btn.classList.remove('active');if(end)end()})}
bindTouchButton('btnLeft',()=>touchState.left=true,()=>touchState.left=false);bindTouchButton('btnRight',()=>touchState.right=true,()=>touchState.right=false);bindTouchButton('btnJab',()=>{if(!isGameOver)triggerPlayerJab()});bindTouchButton('btnHook',()=>{if(!isGameOver)triggerPlayerHook()});bindTouchButton('btnGuard',()=>{if(!isGameOver)player.isGuarding=true},()=>player.isGuarding=false);
function triggerPlayerJab(){if(!player.isPunching&&!player.isGuarding){player.isPunching=true;player.punchType='jab';player.punchTimer=10}}function triggerPlayerHook(){if(!player.isPunching&&!player.isGuarding&&player.stamina>=25){player.isPunching=true;player.punchType='hook';player.punchTimer=16;player.stamina-=25}}
function resetGame(){Object.assign(player,{x:220,hp:100,stamina:100,isPunching:false,isGuarding:false,vx:0,facing:'right'});Object.assign(enemy,{x:720,hp:100,stamina:100,isPunching:false,isGuarding:false,vx:0,aiState:'IDLE',stateTimer:0,punchCooldown:0});particles=[];isGameOver=false;gameMessage=''}
function addDamageParticle(x,y,text,color){particles.push({x,y,text,color,opacity:1,life:30})}function updateParticles(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.y-=1.5;p.opacity-=.03;p.life--;if(p.life<=0)particles.splice(i,1)}}function drawParticles(){particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.opacity);ctx.fillStyle=p.color;ctx.font='bold 20px Segoe UI';ctx.fillText(p.text,p.x,p.y);ctx.restore()})}
function update(){if(isGameOver)return;if(player.stamina<100)player.stamina=Math.min(100,player.stamina+.35);if(enemy.stamina<100)enemy.stamina=Math.min(100,enemy.stamina+.4);let left=keys.KeyA||touchState.left,right=keys.KeyD||touchState.right;if(!player.isPunching){if(left){player.vx=-player.speed;player.facing='left'}else if(right){player.vx=player.speed;player.facing='right'}else player.vx=0}else player.vx=0;player.x=Math.max(RING_LEFT,Math.min(RING_RIGHT-player.width,player.x+player.vx));
if(player.isPunching){player.punchTimer--;let hitFrame=player.punchType==='jab'?5:8;if(player.punchTimer===hitFrame){let range=player.punchType==='jab'?60:80,hitX=player.facing==='right'?player.x+player.width:player.x-range;if(hitX<enemy.x+enemy.width&&hitX+range>enemy.x){let dmg=player.punchType==='jab'?12:28;if(enemy.isGuarding)dmg=Math.floor(dmg*.2);else{enemy.aiState=Math.random()<.6?'GUARD':'RETREAT';enemy.stateTimer=25}enemy.hp-=dmg;addDamageParticle(enemy.x+10,enemy.y-10,'-'+dmg,'#ff1744');enemy.vx=(player.facing==='right'?1:-1)*(player.punchType==='jab'?8:16);if(enemy.hp<=0){enemy.hp=0;isGameOver=true;gameMessage='🏆 K.O.! 플레이어 닭 챔피언 승리!'}}}if(player.punchTimer<=0)player.isPunching=false}
let dist=player.x-enemy.x,absDist=Math.abs(dist);enemy.facing=dist>0?'right':'left';enemy.x+=enemy.vx;enemy.vx*=.8;if(enemy.punchCooldown>0)enemy.punchCooldown--;if(enemy.stateTimer>0)enemy.stateTimer--;if(player.isPunching&&absDist<=90&&enemy.aiState!=='ATTACK'){if(Math.random()<.6){enemy.aiState='GUARD';enemy.stateTimer=20}else if(Math.random()<.9){enemy.aiState='RETREAT';enemy.stateTimer=15}}
if(enemy.stateTimer<=0&&!enemy.isPunching){enemy.isGuarding=false;if(absDist>180){enemy.aiState='ADVANCE';enemy.stateTimer=30}else if(absDist<70){let r=Math.random();if(r<.4&&enemy.punchCooldown<=0)enemy.aiState='ATTACK';else if(r<.7){enemy.aiState='GUARD';enemy.stateTimer=25}else{enemy.aiState='RETREAT';enemy.stateTimer=20}}else{let r=Math.random();enemy.aiState=r<.35?'ADVANCE':r<.7?'RETREAT':'GUARD';enemy.stateTimer=20}}
if(!enemy.isPunching){switch(enemy.aiState){case 'ADVANCE':enemy.x+=(dist>0?1:-1)*enemy.speed;enemy.isGuarding=false;break;case 'RETREAT':enemy.x+=(dist>0?-1:1)*enemy.speed*.9;enemy.isGuarding=false;break;case 'GUARD':enemy.isGuarding=true;enemy.x+=(dist>0?-.5:.5)*enemy.speed;break;case 'ATTACK':if(enemy.punchCooldown<=0){enemy.isPunching=true;enemy.punchType=enemy.stamina>=25&&Math.random()<.4?'hook':'jab';enemy.punchTimer=enemy.punchType==='jab'?12:18;enemy.punchCooldown=45;enemy.isGuarding=false;if(enemy.punchType==='hook')enemy.stamina-=25}enemy.aiState='IDLE';break}}enemy.x=Math.max(RING_LEFT,Math.min(RING_RIGHT-enemy.width,enemy.x));updateParticles();if(enemy.isPunching){enemy.punchTimer--;let hitFrame=enemy.punchType==='jab'?6:9;if(enemy.punchTimer===hitFrame&&Math.abs(player.x-enemy.x)<=75){let dmg=enemy.punchType==='jab'?14:28;if(player.isGuarding)dmg=Math.floor(dmg*.25);player.hp-=dmg;player.vx=enemy.facing==='right'?8:-8;addDamageParticle(player.x+10,player.y-10,'-'+dmg,'#ffca28');if(player.hp<=0){player.hp=0;isGameOver=true;gameMessage='☠️ K.O.... 상대 닭에게 패배했습니다!'}}if(enemy.punchTimer<=0)enemy.isPunching=false}}
function drawChicken(c){ctx.save();ctx.fillStyle=c.color;ctx.beginPath();ctx.ellipse(c.x+c.width/2,c.y+c.height/2+5,c.width/2,c.height/2-5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#ff1744';ctx.beginPath();let combX=c.facing==='right'?c.x+c.width/2+5:c.x+c.width/2-15;ctx.arc(combX,c.y-2,7,0,Math.PI*2);ctx.arc(combX+6,c.y-6,8,0,Math.PI*2);ctx.arc(combX+12,c.y-2,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffc107';ctx.beginPath();let beakX=c.facing==='right'?c.x+c.width-5:c.x-10;ctx.moveTo(c.facing==='right'?c.x+c.width-12:c.x+12,c.y+15);ctx.lineTo(beakX,c.y+22);ctx.lineTo(c.facing==='right'?c.x+c.width-12:c.x+12,c.y+28);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ff1744';ctx.beginPath();ctx.arc(c.facing==='right'?c.x+c.width-10:c.x+10,c.y+32,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(c.facing==='right'?c.x+c.width-18:c.x+18,c.y+16,4,0,Math.PI*2);ctx.fill();if(c.isGuarding){ctx.strokeStyle='#29b6f6';ctx.lineWidth=4;ctx.beginPath();ctx.arc(c.x+c.width/2,c.y+c.height/2,c.width/2+10,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=c.gloveColor;let gloveX=c.facing==='right'?c.x+c.width-5:c.x-15,gloveY=c.y+28;if(c.isPunching){let ext=c.punchType==='hook'?40:28;gloveX+=c.facing==='right'?ext:-ext;ctx.beginPath();ctx.arc(gloveX+10,gloveY,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle=c.punchType==='hook'?'#ff9800':'#ffff00';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(c.facing==='right'?c.x+c.width-15:c.x+15,gloveY);ctx.lineTo(gloveX+10,gloveY);ctx.stroke()}else{ctx.beginPath();ctx.arc(c.facing==='right'?c.x+c.width-10:c.x+10,gloveY,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke()}ctx.strokeStyle='#ffa000';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c.x+15,c.y+c.height-10);ctx.lineTo(c.x+15,c.y+c.height+8);ctx.moveTo(c.x+c.width-15,c.y+c.height-10);ctx.lineTo(c.x+c.width-15,c.y+c.height+8);ctx.stroke();ctx.restore()}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#1c1c28';ctx.fillRect(0,0,1000,420);ctx.fillStyle='#37474f';ctx.fillRect(RING_LEFT,RING_Y,RING_RIGHT-RING_LEFT,80);ctx.lineWidth=4;['#e53935','#fff','#1e88e5'].forEach((col,i)=>{ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(RING_LEFT,RING_Y-30-i*35);ctx.lineTo(RING_RIGHT,RING_Y-30-i*35);ctx.stroke()});ctx.fillStyle='#ffb300';ctx.fillRect(RING_LEFT-12,RING_Y-120,24,200);ctx.fillRect(RING_RIGHT-12,RING_Y-120,24,200);drawChicken(player);drawChicken(enemy);drawParticles();ctx.fillStyle='#d32f2f';ctx.fillRect(20,20,260,20);ctx.fillStyle='#4caf50';ctx.fillRect(20,20,player.hp/100*260,20);ctx.strokeStyle='#fff';ctx.strokeRect(20,20,260,20);ctx.fillStyle='#0288d1';ctx.fillRect(20,44,player.stamina/100*260,8);ctx.fillStyle='#fff';ctx.font='bold 13px Segoe UI';ctx.fillText('PLAYER CHICKEN (RED)',25,35);ctx.fillStyle='#b71c1c';ctx.fillRect(720,20,260,22);let pct=Math.max(0,enemy.hp/100);ctx.fillStyle=pct>.5?'#4caf50':pct>.25?'#ff9800':'#f44336';ctx.fillRect(720,20,pct*260,22);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(720,20,260,22);ctx.fillStyle='#fff';ctx.font='bold 13px Segoe UI';ctx.fillText(`TACTICAL BOSS (${Math.ceil(enemy.hp)} / 100 HP)`,725,36);if(isGameOver){ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,1000,420);ctx.fillStyle=gameMessage.includes('승리')?'#ffca28':'#ff5252';ctx.font='bold 36px Segoe UI';ctx.textAlign='center';ctx.fillText(gameMessage,500,210);ctx.font='16px Segoe UI';ctx.fillStyle='#fff';ctx.fillText('하단의 [경기 재시작] 버튼을 누르세요.',500,260);ctx.textAlign='left'}}function gameLoop(){update();render();requestAnimationFrame(gameLoop)}gameLoop();
</script></body></html>
