<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별 먹기 대모험!</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #7ec8f7 0%, #b3e5fc 60%, #fff9c4 100%);
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  }
  h1 {
    color: #ff5722;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 #ffca28;
    font-size: 2.2em;
    margin: 10px 0;
    letter-spacing: 2px;
  }
  #gameWrap {
    position: relative;
    border: 8px solid #ff9800;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    background: #fff;
  }
  canvas {
    display: block;
    border-radius: 8px;
    background: #90caf9;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.85);
    border: 3px solid #ffca28;
    border-radius: 12px;
    padding: 6px 16px;
    font-size: 18px;
    font-weight: bold;
    color: #e65100;
  }
  #message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: bold;
    color: #d81b60;
    text-shadow: 2px 2px 0 #fff;
    text-align: center;
    white-space: pre-line;
    display: none;
    background: rgba(255,255,255,0.9);
    padding: 20px 30px;
    border-radius: 20px;
    border: 4px dashed #ff5722;
    z-index: 5;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #messageText {
    white-space: pre-line;
  }
  #playAgainBtn {
    display: none;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 10px 26px;
    background: #66bb6a;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 0 #388e3c;
  }
  #playAgainBtn:active {
    box-shadow: 0 1px 0 #388e3c;
    transform: translateY(3px);
  }
  #controls {
    margin-top: 14px;
    background: #fff3e0;
    border: 3px solid #ffb74d;
    border-radius: 14px;
    padding: 10px 20px;
    color: #5d4037;
    font-size: 16px;
    text-align: center;
  }
  #restartBtn {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 18px;
    font-weight: bold;
    background: #66bb6a;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 0 #388e3c;
  }
  #restartBtn:active {
    box-shadow: 0 1px 0 #388e3c;
    transform: translateY(3px);
  }
  #musicBtn {
    margin-top: 10px;
    margin-left: 8px;
    padding: 8px 20px;
    font-size: 18px;
    font-weight: bold;
    background: #ab47bc;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 0 #7b1fa2;
  }
  #musicBtn:active {
    box-shadow: 0 1px 0 #7b1fa2;
    transform: translateY(3px);
  }
  #touchControls {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
  }
  #moveBtns {
    display: flex;
    gap: 10px;
  }
  .ctrlBtn {
    font-size: 26px;
    padding: 14px 20px;
    background: #42a5f5;
    color: #fff;
    border: none;
    border-radius: 14px;
    box-shadow: 0 5px 0 #1565c0;
    cursor: pointer;
    touch-action: none;
  }
  .ctrlBtn:active {
    box-shadow: 0 2px 0 #1565c0;
    transform: translateY(3px);
  }
  #btnJump {
    background: #ff7043;
    box-shadow: 0 5px 0 #d84315;
    font-weight: bold;
  }
  #btnJump:active {
    box-shadow: 0 2px 0 #d84315;
  }
</style>
</head>
<body>

<h1>⭐ 별 먹기 대모험! ⭐</h1>

<div id="gameWrap">
  <canvas id="game" width="800" height="400"></canvas>
  <div id="hud">🏅 최고기록: <span id="best">0</span> &nbsp;|&nbsp; ⭐ 점수: <span id="score">0</span> &nbsp;|&nbsp; <span id="hearts">❤️❤️❤️</span></div>
  <div id="message">
    <div id="messageText"></div>
    <button id="playAgainBtn">🔄 다시하기</button>
  </div>
</div>

<div id="touchControls">
  <div id="moveBtns">
    <button class="ctrlBtn" id="btnLeft">⬅️</button>
    <button class="ctrlBtn" id="btnRight">➡️</button>
  </div>
  <button class="ctrlBtn" id="btnJump">⬆️ 점프</button>
</div>

<div id="controls">
  ⬅️➡️ : 달리기 &nbsp;&nbsp;|&nbsp;&nbsp; ⬆️ 또는 스페이스바 : 점프(두 번 빠르게 누르면 더 높이!) &nbsp;&nbsp;|&nbsp;&nbsp; 아래 버튼을 눌러도 조작할 수 있어요! &nbsp;&nbsp;|&nbsp;&nbsp; 하트 3개를 모두 잃기 전까지 별을 최대한 많이 모아 최고기록에 도전하세요!
  <br>
  <button id="restartBtn">🔄 다시 시작</button>
  <button id="musicBtn">🔊 음악 켜기</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const heartsEl = document.getElementById('hearts');
const messageEl = document.getElementById('message');
const messageTextEl = document.getElementById('messageText');
const playAgainBtn = document.getElementById('playAgainBtn');
const restartBtn = document.getElementById('restartBtn');
const musicBtn = document.getElementById('musicBtn');

// ===== 배경음악 (Web Audio API로 만든 오리지널 8비트 느낌의 곡) =====
// * 실제 마리오 테마곡은 저작권이 있어 그대로 사용할 수 없어서, 비슷한 경쾌한 분위기의 새 멜로디를 만들었어요.
const NOTE_FREQ = {
  'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,'A4':440.00,'B4':493.88,
  'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880.00,'B5':987.77,
  'C6':1046.50,'D6':1174.66,'REST':0
};
const melody = [
  {n:'E5',d:0.16},{n:'E5',d:0.16},{n:'REST',d:0.08},{n:'E5',d:0.16},
  {n:'REST',d:0.08},{n:'C5',d:0.16},{n:'E5',d:0.24},{n:'G5',d:0.32},
  {n:'REST',d:0.24},{n:'G4',d:0.32},{n:'REST',d:0.24},
  {n:'C5',d:0.24},{n:'REST',d:0.12},{n:'G4',d:0.24},{n:'REST',d:0.12},{n:'E4',d:0.24},
  {n:'REST',d:0.12},{n:'A4',d:0.16},{n:'B4',d:0.16},{n:'A4',d:0.16},{n:'G4',d:0.24},
  {n:'E5',d:0.16},{n:'G5',d:0.16},{n:'A5',d:0.32},
  {n:'F5',d:0.16},{n:'G5',d:0.16},{n:'REST',d:0.08},{n:'E5',d:0.16},
  {n:'C5',d:0.16},{n:'D5',d:0.16},{n:'B4',d:0.32},
];

let audioCtx = null;
let musicOn = false;
let musicTimer = null;
let melodyIndex = 0;

function playTone(freq, dur) {
  if (!audioCtx || freq === 0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}

function playMelodyStep() {
  if (!musicOn) return;
  const step = melody[melodyIndex % melody.length];
  playTone(NOTE_FREQ[step.n], step.d);
  melodyIndex++;
  musicTimer = setTimeout(playMelodyStep, step.d * 1000);
}

function toggleMusic() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioCtor();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  musicOn = !musicOn;
  if (musicOn) {
    musicBtn.textContent = '🔇 음악 끄기';
    playMelodyStep();
  } else {
    musicBtn.textContent = '🔊 음악 켜기';
    if (musicTimer) clearTimeout(musicTimer);
  }
}
musicBtn.addEventListener('click', toggleMusic);

const GRAVITY = 0.6;
const GROUND_Y = 360;
let LEVEL_WIDTH = 3000; // 끝없이 이어지도록 계속 늘어남

let keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
    triggerJumpPress();
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

// 점프 버튼을 짧은 시간 안에 두 번 누르면 더 높이 점프하도록 처리
let jumpQueued = null; // 'normal' | 'high' | null
let lastJumpPressTime = -9999;
const DOUBLE_TAP_MS = 350;
function triggerJumpPress() {
  const now = Date.now();
  if (now - lastJumpPressTime < DOUBLE_TAP_MS) {
    jumpQueued = 'high';
  } else {
    jumpQueued = 'normal';
  }
  lastJumpPressTime = now;
}

// 화면 터치/클릭 버튼 연결
function bindHoldButton(el, code) {
  const press = (e) => { e.preventDefault(); keys[code] = true; };
  const release = (e) => { e.preventDefault(); keys[code] = false; };
  el.addEventListener('mousedown', press);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchend', release);
  el.addEventListener('touchcancel', release);
}
bindHoldButton(document.getElementById('btnLeft'), 'ArrowLeft');
bindHoldButton(document.getElementById('btnRight'), 'ArrowRight');

// 점프 버튼은 누를 때마다 한 번씩만 트리거 (두 번 빠르게 누르면 높이 점프)
const btnJumpEl = document.getElementById('btnJump');
const jumpButtonPress = (e) => { e.preventDefault(); triggerJumpPress(); };
btnJumpEl.addEventListener('mousedown', jumpButtonPress);
btnJumpEl.addEventListener('touchstart', jumpButtonPress, { passive: false });

// 무한히 이어지는 레벨: 앞쪽이 부족해지면 새로운 구간(청크)을 계속 생성해서 이어붙임
const CHUNK_SIZE = 2000;
const EXTEND_TRIGGER = 1200; // 레벨 끝에서 이 거리 안으로 들어오면 다음 구간을 미리 생성

function generateChunk(startX, endX) {
  const newPlats = [];
  const newStars = [];
  const newEnemies = [];

  let x = startX;
  while (x < endX) {
    const hasPlatform = Math.random() < 0.6;
    if (hasPlatform) {
      const w = 100 + Math.random() * 80;
      const y = 150 + Math.random() * 160;
      newPlats.push({ x, y, w, h: 20 });
      if (Math.random() < 0.8) {
        newStars.push({ x: x + w / 2, y: y - 26, r: 14, taken: false });
      }
    } else if (Math.random() < 0.6) {
      newStars.push({ x: x, y: 330, r: 14, taken: false });
    }

    if (Math.random() < 0.3) {
      const ex = x + 30 + Math.random() * 40;
      const range = 70 + Math.random() * 100;
      newEnemies.push({
        x: ex, y: GROUND_Y - 30, w: 30, h: 30,
        minX: ex - range / 2, maxX: ex + range / 2,
        dir: 1, speed: 0.6 + Math.random() * 0.5
      });
    }

    x += 180 + Math.random() * 140;
  }

  return { newPlats, newStars, newEnemies };
}

let platforms = [];
let stars = [];
let enemies = [];

function loadNewLevel() {
  LEVEL_WIDTH = 3000;
  platforms = [{ x: -400, y: GROUND_Y, w: LEVEL_WIDTH + 800, h: 40 }]; // 바닥(계속 늘어남)
  const chunk = generateChunk(320, LEVEL_WIDTH - 300);
  platforms.push(...chunk.newPlats);
  stars = chunk.newStars;
  enemies = chunk.newEnemies;
}
loadNewLevel();

// 플레이어가 레벨 끝에 가까워지면 다음 구간을 이어붙이고, 멀리 지나간 옛 구간은 정리
function extendLevelIfNeeded() {
  if (player.x > LEVEL_WIDTH - EXTEND_TRIGGER) {
    const newEnd = LEVEL_WIDTH + CHUNK_SIZE;
    const chunk = generateChunk(LEVEL_WIDTH, newEnd - 300);
    platforms.push(...chunk.newPlats);
    stars.push(...chunk.newStars);
    enemies.push(...chunk.newEnemies);
    LEVEL_WIDTH = newEnd;
    platforms[0].w = LEVEL_WIDTH + 800; // 바닥도 함께 늘리기
  }
  // 이미 한참 지나온 옛 구간은 배열에서 정리 (성능 유지)
  const cleanupBefore = player.x - 1500;
  if (platforms.length > 1) {
    platforms = [platforms[0], ...platforms.slice(1).filter(p => p.x + p.w > cleanupBefore)];
  }
  stars = stars.filter(s => s.x > cleanupBefore);
  enemies = enemies.filter(e => e.maxX > cleanupBefore);
}

// 플레이어 (달리기 가속/감속 물리 적용)
const ACCEL = 0.55;
const FRICTION = 0.45;
const MAX_SPEED = 5.2;
const JUMP_POWER = -12;
const HIGH_JUMP_POWER = -17; // 빠르게 두 번 누르면 이 힘으로 더 높이 점프

let player = {
  x: 20, y: 296, w: 36, h: 44,
  vx: 0, vy: 0,
  jumpPower: JUMP_POWER,
  onGround: false,
  facing: 1,
  invincible: 0,
  animPhase: 0
};

let camera = 0;

let score = 0;
let gameOver = false;
let toastTimer = null;
const MAX_LIVES = 3;
let lives = MAX_LIVES;

// 최고기록 저장/불러오기 (이 브라우저에만 저장됨)
const BEST_KEY = 'starGame_bestScore';
let bestScore = 0;
try {
  const saved = localStorage.getItem(BEST_KEY);
  if (saved !== null) bestScore = parseInt(saved, 10) || 0;
} catch (e) {
  bestScore = 0;
}
bestEl.textContent = bestScore;

function saveBestScore() {
  if (score > bestScore) {
    bestScore = score;
    bestEl.textContent = bestScore;
    try { localStorage.setItem(BEST_KEY, String(bestScore)); } catch (e) { /* 저장 실패 시 무시 */ }
    return true;
  }
  return false;
}

function renderHearts() {
  let s = '';
  for (let i = 0; i < MAX_LIVES; i++) s += (i < lives) ? '❤️' : '🤍';
  heartsEl.textContent = s;
}
renderHearts();

function showToast(text, ms) {
  messageTextEl.textContent = text;
  playAgainBtn.style.display = 'none';
  messageEl.style.display = 'flex';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    if (!gameOver) messageEl.style.display = 'none';
  }, ms);
}

function resetGame() {
  loadNewLevel();
  player = { x: 20, y: 296, w: 36, h: 44, vx: 0, vy: 0, jumpPower: JUMP_POWER, onGround: false, facing: 1, invincible: 0, animPhase: 0 };
  camera = 0;
  score = 0;
  gameOver = false;
  lives = MAX_LIVES;
  renderHearts();
  scoreEl.textContent = score;
  if (toastTimer) clearTimeout(toastTimer);
  messageEl.style.display = 'none';
  playAgainBtn.style.display = 'none';
}
restartBtn.addEventListener('click', resetGame);
playAgainBtn.addEventListener('click', resetGame);

function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function respawnPlayer() {
  player.x = 20; player.y = 296; player.vx = 0; player.vy = 0;
}

function updateCamera() {
  // 클램핑 없이 캐릭터를 항상 화면 정중앙에 고정 -> 캐릭터 대신 거리(배경/바닥)가 움직이는 느낌
  camera = player.x + player.w / 2 - canvas.width / 2;
}

function update() {
  if (gameOver) return;

  // 좌우 달리기 (가속/감속으로 진짜 달리는 느낌)
  if (keys['ArrowLeft']) {
    player.vx -= ACCEL;
    player.facing = -1;
  } else if (keys['ArrowRight']) {
    player.vx += ACCEL;
    player.facing = 1;
  } else {
    if (player.vx > 0) { player.vx -= FRICTION; if (player.vx < 0) player.vx = 0; }
    else if (player.vx < 0) { player.vx += FRICTION; if (player.vx > 0) player.vx = 0; }
  }
  if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
  if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;

  // 달리기 애니메이션 위상 (속도에 비례해서 다리가 빨리 움직임)
  if (player.onGround && Math.abs(player.vx) > 0.3) {
    player.animPhase += Math.abs(player.vx) * 0.55;
  }

  // 점프 (두 번 빠르게 누르면 더 높이!)
  if (jumpQueued && player.onGround) {
    player.vy = (jumpQueued === 'high') ? HIGH_JUMP_POWER : JUMP_POWER;
    player.onGround = false;
  }
  jumpQueued = null; // 공중에 있을 때 눌렀다면 이번 요청은 버림

  // 중력
  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // 레벨 경계 (넓은 스테이지 기준)
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > LEVEL_WIDTH) { player.x = LEVEL_WIDTH - player.w; player.vx = 0; }
  if (player.y > canvas.height) {
    respawnPlayer();
  }

  // 플랫폼 충돌 (위에서 착지)
  player.onGround = false;
  for (const p of platforms) {
    if (player.vy >= 0 &&
        player.x + player.w > p.x && player.x < p.x + p.w &&
        player.y + player.h <= p.y + 12 &&
        player.y + player.h + player.vy >= p.y) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  // 레벨이 끝나지 않도록 앞쪽을 계속 이어붙임 (제한시간이 없으므로 끝없이 진행)
  extendLevelIfNeeded();

  // 카메라 갱신 (캐릭터를 따라감)
  updateCamera();

  // 몬스터 이동
  for (const e of enemies) {
    e.x += e.dir * e.speed;
    if (e.x < e.minX || e.x > e.maxX) e.dir *= -1;
  }

  // 몬스터 충돌
  if (player.invincible > 0) player.invincible--;
  for (const e of enemies) {
    if (rectsCollide(player, e) && player.invincible === 0) {
      lives--;
      renderHearts();
      respawnPlayer();
      player.invincible = 60;
      if (lives <= 0) {
        gameOver = true;
        const isRecord = saveBestScore();
        messageTextEl.textContent = '당신의 점수는 ' + score + '점 입니다' +
          (isRecord ? '\n🎉 NEW RECORD! 🎉' : '\n최고기록: ' + bestScore + '점');
        playAgainBtn.style.display = 'inline-block';
        messageEl.style.display = 'flex';
        return;
      }
    }
  }

  // 별 먹기
  for (const s of stars) {
    if (!s.taken) {
      const dx = (player.x + player.w/2) - s.x;
      const dy = (player.y + player.h/2) - s.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < s.r + 20) {
        s.taken = true;
        score++;
        scoreEl.textContent = score;
        if (audioCtx) playTone(NOTE_FREQ['C6'], 0.12);
      }
    }
  }
}

function drawBackground() {
  // 먼 배경 구름/해는 카메라보다 느리게 움직여서 원근감 표현 (패럴랙스)
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  const parallax = camera * 0.3;
  for (let i = 0; i < 9; i++) {
    const baseX = i * 300 + 80;
    const x = baseX - parallax;
    const wrapped = ((x % (LEVEL_WIDTH)) + LEVEL_WIDTH) % LEVEL_WIDTH;
    if (wrapped > -60 && wrapped < canvas.width + 60) {
      drawCloud(wrapped, 50 + (i % 3) * 25);
    }
  }
  // 해는 화면 고정
  ctx.beginPath();
  ctx.fillStyle = '#ffeb3b';
  ctx.arc(740, 45, 30, 0, Math.PI*2);
  ctx.fill();
}

function drawCloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI*2);
  ctx.arc(x+22, y-8, 22, 0, Math.PI*2);
  ctx.arc(x+44, y, 18, 0, Math.PI*2);
  ctx.fill();
}

function drawPlatforms() {
  for (const p of platforms) {
    const sx = p.x - camera;
    if (sx + p.w < 0 || sx > canvas.width) continue; // 화면 밖이면 생략
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(sx, p.y, p.w, p.h);
    ctx.fillStyle = '#66bb6a';
    ctx.fillRect(sx, p.y, p.w, 10);

    // 벽돌 무늬 (카메라와 함께 스크롤되어 "움직이는 느낌"을 줌)
    ctx.strokeStyle = 'rgba(93,64,55,0.5)';
    ctx.lineWidth = 1;
    const brickSize = 40;
    const worldStart = Math.floor(p.x / brickSize) * brickSize;
    for (let bx = worldStart; bx < p.x + p.w; bx += brickSize) {
      const lineX = bx - camera;
      if (lineX >= sx - 1 && lineX <= sx + p.w + 1) {
        ctx.beginPath();
        ctx.moveTo(lineX, p.y + 10);
        ctx.lineTo(lineX, p.y + p.h);
        ctx.stroke();
      }
    }
  }
}

function drawStar(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.fillStyle = '#ffd600';
  ctx.strokeStyle = '#ff9800';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    ctx.lineTo(Math.cos((18 + i*72) * Math.PI/180) * r, -Math.sin((18 + i*72) * Math.PI/180) * r);
    ctx.lineTo(Math.cos((54 + i*72) * Math.PI/180) * r*0.45, -Math.sin((54 + i*72) * Math.PI/180) * r*0.45);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawStars() {
  const t = Date.now() / 300;
  for (const s of stars) {
    if (!s.taken) {
      const sx = s.x - camera;
      if (sx < -30 || sx > canvas.width + 30) continue;
      const bob = Math.sin(t + s.x) * 4;
      drawStar(sx, s.y + bob, s.r);
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x - camera;
    if (sx + e.w < 0 || sx > canvas.width) continue;
    ctx.fillStyle = '#8e24aa';
    ctx.beginPath();
    ctx.ellipse(sx + e.w/2, e.y + e.h/2, e.w/2, e.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    // 눈
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx + e.w*0.35, e.y + e.h*0.4, 4, 0, Math.PI*2);
    ctx.arc(sx + e.w*0.65, e.y + e.h*0.4, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(sx + e.w*0.35, e.y + e.h*0.4, 2, 0, Math.PI*2);
    ctx.arc(sx + e.w*0.65, e.y + e.h*0.4, 2, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(p.invincible/5) % 2 === 0) return; // 깜빡임

  const screenX = p.x - camera + p.w/2;
  const running = p.onGround && Math.abs(p.vx) > 0.3;
  const bob = running ? Math.abs(Math.sin(p.animPhase)) * 4 : 0; // 달릴 때 위아래로 들썩
  const stride = running ? Math.sin(p.animPhase) * 10 : 0; // 다리 앞뒤 스트라이드 (더 크게)
  const legLiftL = running ? Math.max(0, Math.sin(p.animPhase)) * 5 : 0;  // 앞으로 나온 다리는 살짝 들림
  const legLiftR = running ? Math.max(0, -Math.sin(p.animPhase)) * 5 : 0;

  // 빠르게 달릴 때 뒤로 남는 스피드 라인 (움직임을 확실하게 표현)
  if (running && Math.abs(p.vx) > 2) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const lineX = screenX - p.facing * (p.w/2 + 14 + i*10);
      const lineY = p.y + p.h/2 - 6 + i*8;
      ctx.beginPath();
      ctx.moveTo(lineX, lineY);
      ctx.lineTo(lineX - p.facing * 10, lineY);
      ctx.stroke();
    }
  }

  ctx.save();
  ctx.translate(screenX, p.y + p.h/2 - bob);
  ctx.scale(p.facing, 1);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#3e2723';

  const halfW = p.w/2;
  const halfH = p.h/2;

  // 달릴 때 발 뒤 먼지 효과
  if (running) {
    ctx.save();
    ctx.scale(1/p.facing, 1); // 먼지는 방향 반전 없이
    ctx.fillStyle = 'rgba(180,150,110,0.6)';
    for (let i = 0; i < 4; i++) {
      const dustX = -p.facing * (halfW + 4 + i*8);
      ctx.beginPath();
      ctx.arc(dustX, halfH + bob - 1 - i*1.2, 5 - i, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 신발 (스트라이드로 앞뒤 교차 + 들림)
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(-halfW + stride*0.5, halfH - 6 - legLiftL, 14, 6);
  ctx.fillRect(halfW - 14 - stride*0.5, halfH - 6 - legLiftR, 14, 6);

  // 다리 (파란 멜빵바지, 스트라이드 + 들림 적용)
  ctx.fillStyle = '#1565c0';
  ctx.fillRect(-halfW + 2 + stride, halfH - 18 - legLiftL, 12, 14);
  ctx.fillRect(halfW - 14 - stride, halfH - 18 - legLiftR, 12, 14);
  ctx.strokeRect(-halfW + 2 + stride, halfH - 18 - legLiftL, 12, 14);
  ctx.strokeRect(halfW - 14 - stride, halfH - 18 - legLiftR, 12, 14);

  // 몸통 (빨간 셔츠) - 달릴 때 살짝 앞으로 기울임
  const lean = running ? p.facing * 2 : 0;
  ctx.save();
  ctx.translate(lean, 0);

  ctx.fillStyle = '#e53935';
  ctx.fillRect(-halfW, -halfH + 16, p.w, 20);
  ctx.strokeRect(-halfW, -halfH + 16, p.w, 20);

  // 오버올 상의
  ctx.fillStyle = '#1565c0';
  ctx.fillRect(-halfW + 3, -halfH + 22, p.w - 6, 14);
  ctx.strokeRect(-halfW + 3, -halfH + 22, p.w - 6, 14);
  // 멜빵끈
  ctx.fillRect(-halfW + 6, -halfH + 16, 5, 10);
  ctx.fillRect(halfW - 11, -halfH + 16, 5, 10);
  // 단추
  ctx.fillStyle = '#ffd600';
  ctx.beginPath();
  ctx.arc(-halfW + 8, -halfH + 26, 2.5, 0, Math.PI*2);
  ctx.arc(halfW - 8, -halfH + 26, 2.5, 0, Math.PI*2);
  ctx.fill();

  // 팔 (양쪽 흰 장갑, 달릴 때 반대로 스윙)
  ctx.save();
  ctx.translate(0, running ? -stride*0.4 : 0);
  ctx.fillStyle = '#e53935';
  ctx.fillRect(-halfW - 6, -halfH + 18, 7, 14);
  ctx.strokeRect(-halfW - 6, -halfH + 18, 7, 14);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-halfW - 3, -halfH + 34, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // 얼굴 (살구색 큰 원)
  ctx.fillStyle = '#ffccA0';
  ctx.beginPath();
  ctx.arc(2, -halfH + 10, halfW - 1, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // 코
  ctx.fillStyle = '#f5a97f';
  ctx.beginPath();
  ctx.ellipse(halfW - 6, -halfH + 12, 5, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // 콧수염
  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.ellipse(halfW - 9, -halfH + 17, 9, 3.5, 0, 0, Math.PI*2);
  ctx.fill();

  // 눈
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(halfW - 4, -halfH + 5, 2, 0, Math.PI*2);
  ctx.fill();

  // 모자
  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.arc(2, -halfH + 2, halfW, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(halfW - 2, -halfH + 3, 12, 4, 0, 0, Math.PI);
  ctx.fill();
  ctx.stroke();
  // 모자 배지
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-4, -halfH - 2, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.restore(); // lean
  ctx.restore(); // main
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawPlatforms();
  drawStars();
  drawEnemies();
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
