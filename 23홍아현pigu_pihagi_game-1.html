<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피구 피하기 게임</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#8ed8ff,#e9f9ff);display:flex;justify-content:center;min-height:100vh}.game{width:min(900px,100%);padding:16px}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:20px;padding:12px 18px;margin-bottom:10px;box-shadow:0 5px 15px #6aa3b355}h1{margin:0;font-size:25px}.info{font-weight:bold}#field{position:relative;height:650px;overflow:hidden;border:7px solid #fff;border-radius:25px;background:repeating-linear-gradient(90deg,#78c96f 0 70px,#70bf67 70px 140px);box-shadow:0 8px 20px #417c4d66}.line{position:absolute;inset:12% 8%;border:4px solid #ffffffaa;border-radius:50%}#danger{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#ff7043;color:white;padding:9px 18px;border-radius:18px;font-weight:900;z-index:6;white-space:nowrap}.player{position:absolute;bottom:35px;left:50%;width:62px;height:98px;transform:translateX(-50%) scale(.76);transform-origin:bottom center;z-index:5}.hair{position:absolute;left:12px;top:-1px;width:58px;height:78px;background:#34251f;border-radius:48% 48% 32% 32%;z-index:2}.hair:before{content:"";position:absolute;left:-7px;top:32px;width:19px;height:52px;background:#34251f;border-radius:45% 35% 55% 45%}.hair:after{content:"";position:absolute;right:-7px;top:30px;width:19px;height:55px;background:#34251f;border-radius:35% 45% 45% 55%}.neck{position:absolute;top:49px;left:31px;width:20px;height:16px;background:#f2bf91;border-radius:5px}.body{position:absolute;top:59px;left:5px;width:72px;height:66px;background:#2878dc;border-radius:18px 18px 8px 8px;border:3px solid #185eb8}.num{position:absolute;top:68px;left:0;width:82px;text-align:center;color:#fff;font-size:27px;font-weight:900;text-shadow:1px 2px #185eb8}.arm{position:absolute;top:67px;width:17px;height:58px;background:#f2bf91;border-radius:12px}.arm.l{left:-7px}.arm.r{right:-7px}.pants{position:absolute;top:112px;left:8px;width:66px;height:27px;background:#245eaf;border-radius:4px 4px 9px 9px}.leg{position:absolute;top:134px;width:22px;height:39px;background:#f2bf91;border-radius:8px}.leg.l{left:19px}.leg.r{right:19px}.ball{position:absolute;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffd66b 0 8%,#ff9e16 22%,#f47b08 70%,#c85300);box-shadow:inset -5px -6px 7px #a83c0077,0 4px 8px #3335;z-index:4}.ball:before,.ball:after{content:"";position:absolute;border:3px solid white;width:25px;height:12px;border-radius:50%}.ball:before{left:5px;top:2px;transform:rotate(35deg)}.ball:after{left:8px;top:21px;transform:rotate(-35deg)}.controls{display:flex;justify-content:center;gap:15px;margin-top:12px}button{border:0;border-radius:15px;padding:13px 22px;font-size:18px;font-weight:bold;background:#fff;box-shadow:0 4px 8px #4c718855;cursor:pointer}.arrow{width:62px;height:52px;padding:0;font-size:25px;background:#ffe36e}#start{background:#ff8a4c;color:#fff}.overlay{position:absolute;inset:0;background:#17324dcc;display:flex;align-items:center;justify-content:center;z-index:10}.card{background:#fff;border-radius:25px;padding:28px;text-align:center;width:min(430px,90%)}.card h2{margin-top:0;font-size:30px}
</style></head><body><div class="game"><div class="top"><h1>🏐 피구 피하기!</h1><div class="info">❤️ <span id="lives">5</span>　⭐ <span id="score">0</span></div></div><div id="field"><div class="line"></div><div id="danger">공이 빨라지고 많아질 수 있어요!</div><div class="player"><div class="hair"></div><div class="neck"></div><div class="body"></div><div class="num">17</div><div class="arm l"></div><div class="arm r"></div><div class="pants"></div><div class="leg l"></div><div class="leg r"></div></div><div class="overlay" id="overlay"><div class="card"><h2>🏐 피구 피하기</h2><p>날아오는 주황색 피구공을<br><b>← → ↑ ↓</b>로 피해 보세요!<br>생명은 5개예요.</p><button id="start">게임 시작!</button></div></div></div><div class="controls"><button class="arrow" data-key="ArrowLeft">←</button><button class="arrow" data-key="ArrowUp">↑</button><button class="arrow" data-key="ArrowDown">↓</button><button class="arrow" data-key="ArrowRight">→</button></div></div>
<script>
const f=document.getElementById('field'),p=document.querySelector('.player'),lv=document.getElementById('lives'),sc=document.getElementById('score'),ov=document.getElementById('overlay');let keys={},bs=[],run=false,lives=5,score=0,last=0,sp=0,swarm=false,phase=0,px=50,py=0;
function hitSound(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=150;o.type='square';g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
function update(){lv.textContent=lives;sc.textContent=score}
function addBall(){let e=document.createElement('div');e.className='ball';let x=4+Math.random()*92;e.style.left=x+'%';e.style.top='-45px';f.appendChild(e);bs.push({e,x,y:-45,s:360+Math.random()*360})}
function start(){bs.forEach(b=>b.e.remove());bs=[];lives=5;score=0;px=50;py=0;phase=0;swarm=false;sp=0;run=true;ov.style.display='none';update();last=performance.now();requestAnimationFrame(loop)}
function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.04);last=t;phase+=dt;if(phase>6){phase=0;swarm=!swarm}sp-=dt;if(sp<=0){addBall();sp=swarm?.035+Math.random()*.035:.10+Math.random()*.14}let w=f.clientWidth,h=f.clientHeight,tx=px/100*(w-82),ty=h-35-130+py;p.style.left=px+'%';p.style.bottom=(35-py)+'px';for(let i=bs.length-1;i>=0;i--){let b=bs[i];b.y+=b.s*dt;b.e.style.top=b.y+'px';if(Math.abs(b.x/100*w-(tx+41))<48&&Math.abs(b.y-(ty+80))<70){b.e.remove();bs.splice(i,1);lives--;hitSound();update();if(lives<=0){run=false;document.querySelector('.card h2').textContent='게임 끝!';document.querySelector('.card p').innerHTML='점수: <b>'+score+'</b>점<br>다시 도전해 보세요!';document.getElementById('start').textContent='다시 시작';ov.style.display='flex'}continue}if(b.y>h+30){b.e.remove();bs.splice(i,1);score++;update()}}requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys[e.key]=true}});document.addEventListener('keyup',e=>keys[e.key]=false);setInterval(()=>{if(!run)return;if(keys.ArrowLeft)px=Math.max(7,px-2.5);if(keys.ArrowRight)px=Math.min(93,px+2.5);if(keys.ArrowUp)py=Math.min(35,py+2.2);if(keys.ArrowDown)py=Math.max(-5,py-2.2)},30);document.querySelectorAll('.arrow').forEach(b=>{let k=b.dataset.key;b.onpointerdown=()=>keys[k]=true;b.onpointerup=()=>keys[k]=false;b.onpointerleave=()=>keys[k]=false});document.getElementById('start').onclick=start;
</script></body></html>
