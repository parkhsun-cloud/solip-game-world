<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 작은 동물마을</title>
<style>
:root{--ink:#514b45;--paper:#fffdf7;--cream:#f3ead9;--sky:#d9ecee;--grass:#cbdca4;--line:#cfc2ac;--green:#91ad79}
*{box-sizing:border-box}body{margin:0;background:#e9e2d5;color:var(--ink);font-family:"Arial Rounded MT Bold","Noto Sans KR","Malgun Gothic",sans-serif}
button,input{font:inherit}button{cursor:pointer;color:var(--ink)}
#game{max-width:760px;margin:auto;min-height:100vh;background:var(--paper)}
header{padding:15px;text-align:center;border-bottom:2px solid var(--line);background:#fffaf0}h1{margin:0;font-size:29px;font-weight:900}
.sub{font-size:12px;font-weight:700;color:#776f66;margin-top:3px}
#stats{display:flex;gap:6px;overflow:auto;padding:8px;background:#fffaf0}.stat{min-width:95px;border:2px solid var(--line);border-radius:18px;padding:7px;background:#fffdf8;font-size:12px;font-weight:900}.bar{height:8px;background:#e9e1d2;border-radius:99px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
main{padding:10px}#world{position:relative;height:310px;border:2px solid #aaa08e;border-radius:25px;overflow:hidden;background:linear-gradient(#dcecef 0 57%,#cbdca4 57%)}
.cloud{position:absolute;font-size:35px}.house{position:absolute;left:8%;bottom:16%;font-size:92px}.tree{position:absolute;right:8%;bottom:16%;font-size:78px}
.pet{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);font-size:90px}.thought{position:absolute;left:50%;top:10%;transform:translateX(-50%);background:#fff;border:2px solid #aaa08e;border-radius:22px;padding:8px 12px;font-size:13px;font-weight:900;white-space:nowrap}
#ground{position:absolute;bottom:0;left:0;right:0;height:16%;background:#b9cd8d}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.tabs button,.tile,.choice,.food{border:2px solid var(--line);background:#fffdf8;border-radius:18px;padding:11px 8px;font-weight:900}.tabs button.active{background:#e7f0d7;border-color:var(--green)}
.panel{border:2px solid var(--line);border-radius:22px;padding:12px;background:#fffaf0;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.foodGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.food{min-height:75px;font-size:13px}.food b{font-size:28px;display:block}
.note{font-size:12px;font-weight:700;line-height:1.45;color:#71695f}.big{width:100%;padding:14px;border:2px solid var(--line);border-radius:20px;background:#fffdf8;font-weight:900}
#overlay{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:2px solid #aaa08e;border-radius:25px;padding:15px}.close{float:right;border:0;background:transparent;font-size:24px}
#intro{position:fixed;inset:0;background:#e9e2d5;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.intro{width:min(600px,100%);background:#fffaf0;border:2px solid var(--line);border-radius:28px;padding:18px;text-align:center}.animalChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.animalChoices button{border:2px solid var(--line);border-radius:18px;background:#fffdf8;padding:8px}.animalChoices button.sel{background:#e7f0d7;border-color:var(--green)}.name{width:100%;border:2px solid var(--line);border-radius:16px;padding:12px}.start{margin-top:10px;width:100%;border:0;border-radius:18px;background:#91ad79;padding:14px;font-weight:900}
.mini{border:2px dashed #b9aa92;border-radius:20px;padding:12px;background:#fffdf4;margin-top:10px}.arena{height:230px;position:relative;overflow:hidden;border:2px solid #c5d4d0;border-radius:19px;background:#dcecef;touch-action:none}
.target{position:absolute;border:0;background:white;border-radius:50%;width:58px;height:58px;font-size:30px;box-shadow:0 3px #0002}.player{position:absolute;font-size:45px;left:10%;bottom:15%;transition:left .12s}.obstacle{position:absolute;font-size:40px;right:8%;bottom:14%}
.miniBtns,.choiceRow{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:8px}.miniBtns button,.choice{border:2px solid var(--line);border-radius:16px;background:#fffdf8;padding:10px 13px;font-weight:900}.recipe{text-align:center;font-size:20px;font-weight:900;padding:12px}.dirt{position:absolute;border:0;background:transparent;font-size:28px}.msg{text-align:center;font-weight:900;min-height:24px;margin:7px}
@media(max-width:450px){.foodGrid{grid-template-columns:repeat(4,1fr)}.pet{font-size:82px}#world{height:280px}}
</style></head><body>
<div id="game"><header><h1>🐾 나의 작은 동물마을</h1><div class="sub">내가 직접 움직이고 성공해서 보상받는 동물 키우기!</div></header><div id="stats"></div><main>
<div id="world"><div class="cloud" style="left:8%;top:7%">☁️</div><div class="cloud" style="right:28%;top:17%">☁️</div><div class="house">🏡</div><div class="tree">🌳</div><div id="thought" class="thought"></div><div id="pet" class="pet">🐶</div><div id="ground"></div></div>
<div class="tabs"><button data-tab="care">🌿 돌보기</button><button data-tab="food">🍱 밥상</button><button data-tab="games">🎮 놀이터</button><button data-tab="town">🗺️ 마을</button><button data-tab="closet">🧥 옷장</button><button data-tab="house">🏡 집</button></div>
<div id="content"></div></main></div>
<div id="overlay"><div class="modal"><button class="close" onclick="closeOverlay()">×</button><div id="modalBody"></div></div></div>
<div id="intro"><div class="intro"><h1>🐾 나의 작은 동물마을</h1><p class="note">친구를 고르고 이름을 지어주세요!</p><div id="animalChoices" class="animalChoices"></div><input id="petName" class="name" maxlength="8" placeholder="동물 이름"><button class="start" onclick="startGame()">마을에 들어가기 🌿</button></div></div>
<script>
const animals=[{emoji:'🐶',name:'몽이',type:'강아지'},{emoji:'🐱',name:'냥이',type:'고양이'},{emoji:'🐰',name:'토끼',type:'토끼'},{emoji:'🐹',name:'콩이',type:'햄스터'},{emoji:'🦊',name:'여우',type:'여우'},{emoji:'🐻',name:'곰돌이',type:'곰'},{emoji:'🐼',name:'판다',type:'판다'},{emoji:'🐷',name:'꿀꿀이',type:'돼지'},{emoji:'🐸',name:'개구리',type:'개구리'},{emoji:'🐥',name:'삐약이',type:'병아리'},{emoji:'🐧',name:'펭이',type:'펭귄'},{emoji:'🐵',name:'몽키',type:'원숭이'}], foods=[{emoji:'🌽',name:'옥수수',cost:0,hunger:20},{emoji:'🍎',name:'사과',cost:15,hunger:25},{emoji:'🥕',name:'당근',cost:20,hunger:25},{emoji:'🐟',name:'생선',cost:35,hunger:35},{emoji:'🍗',name:'고기',cost:45,hunger:40},{emoji:'🍓',name:'딸기',cost:30,hunger:22},{emoji:'🍉',name:'수박',cost:35,hunger:28},{emoji:'🍰',name:'케이크',cost:80,hunger:38}];
let s={money:300,level:1,xp:0,happy:60,hunger:75,clean:75,energy:100,animal:animals[0],name:'몽이',house:0,outfit:'기본 옷'};
let second=null,active=0,selectedAnimal=0,tab='care';
const need=()=>70+s.level*30, p=()=>active===0?s:second, pets=()=>[s,...(second?[second]:[])];
function pop(t){openOverlay();document.getElementById('modalBody').innerHTML='<div style="text-align:center;font-size:25px;padding:20px;font-weight:900">'+t+'</div><button class="big" onclick="closeOverlay()">좋아요! 💗</button>'}
function gain(x){s.xp+=x;if(s.xp>=need()){s.xp-=need();s.level++;if(s.level>=10&&!second)unlockSecond();setTimeout(()=>pop('🎉 레벨 '+s.level+'! '+s.name+'가 쑥쑥 자랐어요!'),20)}}
function unlockSecond(){let a=animals[(s.level+4)%animals.length];second={animal:a,name:a.name,level:1,xp:0,happy:60,hunger:75,clean:75,energy:100};}
function openOverlay(){document.getElementById('overlay').style.display='flex'}function closeOverlay(){document.getElementById('overlay').style.display='none'}
function chooseAnimal(i){selectedAnimal=i;document.querySelectorAll('#animalChoices button').forEach((b,j)=>b.classList.toggle('sel',i===j))}
function initIntro(){document.getElementById('animalChoices').innerHTML=animals.map((a,i)=>'<button onclick="chooseAnimal('+i+')"><b style="font-size:30px">'+a.emoji+'</b><br>'+a.name+'</button>').join('');chooseAnimal(0)}
function startGame(){s.animal=animals[selectedAnimal];s.name=document.getElementById('petName').value.trim()||s.animal.name;document.getElementById('intro').style.display='none';render()}
function selectPet(i){active=i;render()}
function renderStats(){let q=p(), vals=[['💗',q.happy],['🍚',q.hunger],['🫧',q.clean],['⚡',q.energy]];document.getElementById('stats').innerHTML='<div class="stat">🪙 '+s.money+'</div><div class="stat">⭐ Lv.'+s.level+'<div class="bar"><i style="width:'+Math.round(s.xp/need()*100)+'%"></i></div></div>'+vals.map(v=>'<div class="stat">'+v[0]+' '+v[1]+'<div class="bar"><i style="width:'+v[1]+'%"></i></div></div>').join('')}
function renderWorld(){let q=p();document.getElementById('pet').textContent=q.animal.emoji;document.getElementById('pet').style.fontSize=Math.min(125,78+(q.level||s.level)*7)+'px';document.getElementById('thought').textContent=q.hunger<35?'🍚 배에서 꼬르륵…':q.energy<30?'🥱 졸려…':q.clean<35?'🫧 씻고 싶어!':q.happy>80?'💗 너무 행복해!':'🐾 뭐 하고 놀까?'}
function render(){renderStats();renderWorld();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let c=document.getElementById('content');if(tab==='care')c.innerHTML=care();if(tab==='food')c.innerHTML=food();if(tab==='games')c.innerHTML=games();if(tab==='town')c.innerHTML=town();if(tab==='closet')c.innerHTML=closet();if(tab==='house')c.innerHTML=house()}
function care(){return '<div class="panel"><b>🌿 '+p().name+' 돌보기</b><p class="note">이번엔 직접 하는 놀이가 중심이에요!</p><div class="grid"><button class="tile" onclick="pet()">🐾 쓰담쓰담</button><button class="tile" onclick="startMini(\'bath\')">🫧 거품 목욕</button><button class="tile" onclick="startMini(\'walk\')">🌳 장애물 산책</button><button class="tile" onclick="sleepGame()">🛏️ 이불 토닥토닥</button></div></div><div class="panel"><b>🐾 친구 바꾸기</b><div class="choiceRow">'+pets().map((x,i)=>'<button class="choice" onclick="selectPet('+i+')">'+x.animal.emoji+' '+x.name+'</button>').join('')+'</div>'+(s.level<10?'<p class="note">🌟 레벨 10이 되면 두 번째 친구가 생겨요!</p>':'<p class="note">🎉 두 마리와 함께 살고 있어요!</p>')+'</div>'}
function food(){return '<div class="panel"><b>🍱 먼저 음식을 골라주세요!</b><p class="note">음식을 고르면 동물이 바로 먹고, 귀여운 반응이 나와요.</p><div class="foodGrid">'+foods.map((f,i)=>'<button class="food" onclick="feed('+i+')"><b>'+f.emoji+'</b>'+f.name+'<br>'+f.cost+'🪙</button>').join('')+'</div></div>'}
function games(){return '<div class="panel"><b>🎮 진짜 미니게임</b><p class="note">누르기만 하는 버튼이 아니라, 직접 성공해야 보상받아요!</p><div class="grid"><button class="tile" onclick="startMini(\'catch\')">🎾<br>움직이는 공 잡기</button><button class="tile" onclick="startMini(\'fish\')">🎣<br>타이밍 낚시</button><button class="tile" onclick="startMini(\'cook\')">🍳<br>간식 만들기</button><button class="tile" onclick="startMini(\'clean\')">🧹<br>방 청소</button><button class="tile" onclick="startMini(\'garden\')">🌱<br>텃밭 키우기</button><button class="tile" onclick="startMini(\'puzzle\')">🧩<br>동물 퍼즐</button><button class="tile" onclick="startMini(\'treasure\')">🔎<br>보물찾기</button></div></div>'}
function town(){return '<div class="panel"><b>🗺️ 마을에서 놀기</b><div class="grid"><button class="tile" onclick="place(1)">🎠<br>놀이터</button><button class="tile" onclick="place(2)">☕<br>동물 카페</button><button class="tile" onclick="place(3)">🏥<br>동물 병원</button><button class="tile" onclick="place(4)">🌲<br>숲속 길</button></div></div><div class="panel"><b>🏆 마을 레벨 TOP 3</b><p>🥇 '+s.name+' — Lv.'+s.level+'</p><p>🥈 초코 — Lv.'+Math.max(1,s.level-1)+'</p><p>🥉 별이 — Lv.'+Math.max(1,s.level-2)+'</p></div>'}
function closet(){return '<div class="panel"><b>🧥 옷장</b><div class="grid"><button class="tile" onclick="buyOutfit(\'🍓 딸기 후드\',400)">🍓 딸기 후드<br>400🪙</button><button class="tile" onclick="buyOutfit(\'🌙 별빛 잠옷\',900)">🌙 별빛 잠옷<br>900🪙</button><button class="tile" onclick="buyOutfit(\'👑 왕자 망토\',1800)">👑 왕자 망토<br>1800🪙</button><button class="tile" onclick="buyOutfit(\'✨ 황금 럭셔리\',18000)">✨ 황금 럭셔리<br>18000🪙</button></div></div>'}
function house(){return '<div class="panel"><b>🏡 집</b><div class="grid"><button class="tile" onclick="buyHouse(0,0)">🏡 작은 집<br>무료</button><button class="tile" onclick="buyHouse(1,2500)">🏠 2층 집<br>2500🪙</button><button class="tile" onclick="buyHouse(2,8000)">🏘️ 고급 빌라<br>8000🪙</button><button class="tile" onclick="buyHouse(3,20000)">🏰 대저택<br>20000🪙</button></div></div>'}
function pet(){let q=p();q.happy=Math.min(100,q.happy+10);gain(5);pop('🐾 쓰담쓰담! '+q.name+'가 꼬리를 살랑살랑!')}
function feed(i){let f=foods[i],q=p();if(s.money<f.cost){pop('🪙 코인이 부족해요!');return}s.money-=f.cost;q.hunger=Math.min(100,q.hunger+f.hunger);q.happy=Math.min(100,q.happy+7);gain(8);pop(f.emoji+' 냠냠! '+q.name+'가 맛있게 먹었어요!')}
function place(i){let q=p();if(i===1){q.happy=Math.min(100,q.happy+15);q.energy-=7;gain(7);pop('🎠 슝슝! 놀이터에서 놀았어요!')}if(i===2){q.hunger=Math.min(100,q.hunger+12);q.happy+=8;s.money+=10;gain(6);pop('☕ 냠냠! 카페 간식 최고!')}if(i===3){q.energy=Math.min(100,q.energy+18);gain(8);pop('🏥 건강검진 완료!')}if(i===4){q.happy+=15;q.energy-=8;gain(9);pop('🌲 숲길을 산책했어요!')}render()}
function buyOutfit(n,c){if(s.money<c)return pop('🪙 코인이 부족해요!');s.money-=c;p().outfit=n;pop('🧥 '+n+' 착용!');render()}
function buyHouse(i,c){if(s.level<i*3+1)return pop('🔒 레벨 '+(i*3+1)+'부터 살 수 있어요!');if(s.money<c)return pop('🪙 코인이 부족해요!');s.money-=c;s.house=i;pop('🏡 새 집으로 이사했어요!');render()}
function sleepGame(){let a=document.createElement('div');a.className='mini';a.innerHTML='<h3>🛏️ 이불 토닥토닥</h3><p class="note">하트가 나타날 때마다 눌러서 5번 토닥여 주세요!</p><div class="arena"><button id="sleepHeart" class="target">💗</button></div><div id="sleepMsg" class="msg">0 / 5</div>';document.getElementById('content').prepend(a);let n=0,h=a.querySelector('#sleepHeart');h.onclick=()=>{n++;a.querySelector('#sleepMsg').textContent=n+' / 5';h.style.left=Math.random()*75+8+'%';h.style.top=Math.random()*65+10+'%';if(n===5){p().energy=Math.min(100,p().energy+35);p().happy=Math.min(100,p().happy+8);gain(12);a.remove();pop('😴 새근새근… 푹 잤어요!');render()}}}
function miniBase(title,hint){let d=document.createElement('div');d.className='mini';d.innerHTML='<h3>🎮 '+title+'</h3><p class="note">'+hint+'</p><div class="slot"></div>';document.getElementById('content').prepend(d);return d}
function finish(d,title,c,x){d.remove();s.money+=c;gain(x);p().happy=Math.min(100,p().happy+8);pop('🎉 '+title+' 성공! +'+c+'🪙');render()}
function startMini(type){
 if(document.querySelector('.mini'))document.querySelector('.mini').remove();
 if(type==='catch'){let d=miniBase('공 잡기','움직이는 공을 5번 잡으세요!'),slot=d.querySelector('.slot');slot.innerHTML='<div class="arena"></div><div class="msg">0 / 5</div>';let ar=slot.querySelector('.arena'),m=slot.querySelector('.msg'),b=document.createElement('button');b.className='target';b.textContent='🎾';ar.append(b);let n=0,move=()=>{b.style.left=Math.random()*78+8+'%';b.style.top=Math.random()*65+8+'%'};b.onclick=()=>{n++;m.textContent=n+' / 5';if(n===5)finish(d,'공 잡기',50,12);else move()};move()}
 if(type==='fish'){let d=miniBase('타이밍 낚시','물고기가 보일 때만 낚싯대를 당기세요! 4마리 성공.'),slot=d.querySelector('.slot');slot.innerHTML='<div class="arena"><span id="fish" style="position:absolute;font-size:42px">🐟</span></div><div class="miniBtns"><button id="pull">🎣 당기기</button></div><div class="msg">0 / 4</div>';let ar=slot.querySelector('.arena'),f=slot.querySelector('#fish'),m=slot.querySelector('.msg'),n=0,ok=false;function spawn(){ok=true;f.style.left=Math.random()*75+8+'%';f.style.top=Math.random()*60+10+'%'}slot.querySelector('#pull').onclick=()=>{if(ok){ok=false;n++;m.textContent=n+' / 4';if(n===4)finish(d,'낚시',60,15)}else pop('🌊 아직 물고기가 안 왔어요!')};spawn();d.timer=setInterval(spawn,1000)}
 if(type==='walk'){let d=miniBase('장애물 산책','⬅️➡️로 움직여 바위 옆을 안전하게 지나가세요. 5번 성공.'),slot=d.querySelector('.slot');slot.innerHTML='<div class="arena"><div class="player">'+p().animal.emoji+'</div><div class="obstacle">🪨</div></div><div class="miniBtns"><button id="l">⬅️</button><button id="r">➡️</button></div><div class="msg">0 / 5</div>';let pl=slot.querySelector('.player'),m=slot.querySelector('.msg'),x=10,n=0;function mv(dx){x=Math.max(2,Math.min(85,x+dx));pl.style.left=x+'%';if(Math.abs(x-75)<9){n++;m.textContent=n+' / 5';slot.querySelector('.obstacle').style.right=Math.random()*80+5+'%';if(n===5)finish(d,'산책',55,14)}}slot.querySelector('#l').onclick=()=>mv(-12);slot.querySelector('#r').onclick=()=>mv(12)}
 if(type==='bath'){let d=miniBase('거품 목욕','갈색 점 6개를 찾아서 눌러 깨끗하게 해주세요!'),slot=d.querySelector('.slot'),ar=document.createElement('div');ar.className='arena';slot.append(ar);let n=0;for(let i=0;i<6;i++){let b=document.createElement('button');b.className='dirt';b.textContent='🟤';b.style.left=7+i*14+'%';b.style.top=15+(i%3)*27+'%';b.onclick=()=>{b.textContent='🫧';b.disabled=true;n++;if(n===6)finish(d,'거품 목욕',50,13)};ar.append(b)}}
 if(type==='cook'){let d=miniBase('간식 요리','정해진 순서로 재료를 골라 딸기 케이크를 완성하세요.'),slot=d.querySelector('.slot');slot.innerHTML='<div class="recipe">🍓 딸기 → 🌾 밀가루 → 🥛 생크림</div><div class="choiceRow"></div>';let row=slot.querySelector('.choiceRow'),order=['🍓 딸기','🌾 밀가루','🥛 생크림'],n=0;[...order].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{if(v===order[n]){b.disabled=true;n++;if(n===3)finish(d,'간식 요리',70,18)}else pop('👩‍🍳 순서가 달라요!')};row.append(b)})}
