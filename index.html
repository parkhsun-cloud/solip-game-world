<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2026 강북초 솔잎반 게임랜드</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf8ed;
    text-align: center;
    padding: 30px;
}

h1 {
    color: #267a43;
}

.container {
    max-width: 900px;
    margin: auto;
}

.games {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 35px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 12px #00000015;
}

button {
    background: #48ad69;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #278547;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 2026 강북초 솔잎반 게임랜드</h1>

<p>우리 반 친구들이 직접 만든 게임에 도전하세요!</p>

<div class="games">

<div class="card">
<h2>🐔 닭들의 복싱 챔피언십</h2>
<p>1번 친구의 게임</p>
<a href="games/game01.html">
<button>게임 시작</button>
</a>
</div>

<div class="card">
<h2>🎯 버튼 클릭 게임</h2>
<p>2번 친구의 게임</p>
<a href="games/game02.html">
<button>게임 시작</button>
</a>
</div>

<div class="card">
<h2>🚀 우주 탐험</h2>
<p>3번 친구의 게임</p>
<a href="games/game03.html">
<button>게임 시작</button>
</a>
</div>

</div>
</div>

</body>
</html>
